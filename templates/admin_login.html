<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | AI Data Cleaner</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #101827, #1e293b);
            color: #fff;
        }

        .login-card {
            width: 90%;
            max-width: 400px;
            padding: 35px;
            background: #202c3d;
            border: 1px solid #344256;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .logo {
            text-align: center;
            font-size: 42px;
            margin-bottom: 12px;
        }

        h1 {
            text-align: center;
            font-size: 25px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #aab7c8;
            font-size: 14px;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin: 16px 0 8px;
            color: #dce5f1;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #45546a;
            border-radius: 8px;
            background: #111b2a;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #5b9cff;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #3b82f6;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #2563eb;
        }

        .error {
            margin-top: 15px;
            padding: 10px;
            border-radius: 7px;
            background: #49252b;
            color: #ffb4b4;
            text-align: center;
            font-size: 14px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #9bbdf5;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="logo">🔐</div>

        <h1>Admin Login</h1>
        <p class="subtitle">AI-Powered Data Cleaning & Analysis Tool</p>

        <form method="POST" action="/admin-login">
            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter admin username"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter admin password"
                required
            >

            <button type="submit">Login to Admin Panel</button>
        </form>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <a href="/" class="back-link">← Back to Dashboard</a>
    </div>
</body>
</html>
